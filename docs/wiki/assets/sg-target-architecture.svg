<svg xmlns="http://www.w3.org/2000/svg" width="780" height="664" viewBox="0 0 780 664" role="img" aria-label="Proposed scoped Security Guardian execution architecture"><rect width="100%" height="100%" rx="18" fill="#f5f8fc"/><g font-family="system-ui,Arial,sans-serif" fill="#152b46"><text x="28" y="38" font-size="23" font-weight="700">Security Guardian · proposed execution architecture</text><text x="28" y="60" font-size="14" >Developer-first · scope-limited · local-first · evidence-driven</text><rect x="200" y="80" width="380" height="52" rx="9" fill="#163956"/><text x="390" y="102" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">User intent + project rules</text><text x="390" y="120" font-size="11" fill="#fff" text-anchor="middle">Agent Skills · AGENTS.md · native adapters</text><path d="M390 132V142m-5 -1 5 6 5 -6" stroke="#6b8299" stroke-width="2" fill="none"/><rect x="170" y="148" width="440" height="52" rx="9" fill="#207885"/><text x="390" y="170" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Scope resolver</text><text x="390" y="188" font-size="11" fill="#fff" text-anchor="middle">Manifest evidence · user selection · approved profile</text><path d="M390 200V210m-5 -1 5 6 5 -6" stroke="#6b8299" stroke-width="2" fill="none"/><path d="M150 216H630M150 216V231M390 216V231M630 216V231" fill="none" stroke="#6b8299" stroke-width="2"/><rect x="38" y="231" width="224" height="54" rx="9" fill="#395e83"/><text x="150" y="253" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Frontend packs</text><text x="150" y="271" font-size="11" fill="#fff" text-anchor="middle">Web · Angular · React · Vue · Svelte</text><rect x="278" y="231" width="224" height="54" rx="9" fill="#395e83"/><text x="390" y="253" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Backend packs</text><text x="390" y="271" font-size="11" fill="#fff" text-anchor="middle">HTTP · Auth · DB · business logic</text><rect x="518" y="231" width="