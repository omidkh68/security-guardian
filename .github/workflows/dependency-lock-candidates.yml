name: Dependency lock candidate evidence
on:
  pull_request:
    paths:
      - '.github/workflows/dependency-lock-candidates.yml'
      - 'scripts/dependency_lock_candidate.py'
      - 'scripts/test_dependency_lock_candidate.py'
      - 'scripts/requirements-framework-fixture.txt'
      - 'scripts/requirements-standards-candidate.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-fixture-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Generate review-only wheel hash candidate
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p test_dependency_lock_candidate.py -v
          mkdir "$RUNNER_TEMP/sg-wheels"
          python -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/sg-wheels" -r scripts/requirements-framework-fixture.txt
          python scripts/dependency_lock_candidate.py scripts/requirements-framework-fixture.txt "$RUNNER_TEMP/sg-wheels" "$RUNNER_TEMP/sg-lock-candidate"
      - name: Exercise candidate offline and preserve existing runtime checks
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sg-lock-venv"
          PY="$RUNNER_TEMP/sg-lock-venv/bin/python"
          "$PY" -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/sg-wheels" --only-binary=:all: --no-deps --require-hashes -r "$RUNNER_TEMP/sg-lock-candidate/requirements-candidate.txt"
          "$PY" -m pip check
          "$PY" scripts/test_framework_verification.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-fixture-lock-candidate
          path: ${{ runner.temp }}/sg-lock-candidate/
          if-no-files-found: error
          retention-days: 7

  python-standards-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Generate review-only standards wheel hash candidate
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p test_dependency_lock_candidate.py -v
          mkdir "$RUNNER_TEMP/sg-standards-wheels"
          python -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/sg-standards-wheels" -r scripts/requirements-standards-candidate.txt
          python scripts/dependency_lock_candidate.py scripts/requirements-standards-candidate.txt "$RUNNER_TEMP/sg-standards-wheels" "$RUNNER_TEMP/sg-standards-lock-candidate" --scope standards
      - name: Exercise standards candidate offline
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sg-standards-lock-venv"
          PY="$RUNNER_TEMP/sg-standards-lock-venv/bin/python"
          "$PY" -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/sg-standards-wheels" --only-binary=:all: --no-deps --require-hashes -r "$RUNNER_TEMP/sg-standards-lock-candidate/requirements-candidate.txt"
          "$PY" -m pip check
          "$PY" - "$RUNNER_TEMP/sarif-schema.json" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from verify_standards_sources import fetch,s
          raw=fetch('https://raw.githubusercontent.com/oasis-tcs/sarif-spec/1742a253eb654bf8a4ed7c60eaef7412b2c23553/sarif-2.1/schema/sarif-schema-2.1.0.json',8_000_000)
          if s.git_blob(raw)!='0f58372b548f60c84d20fca77687435e71b3b3a3':
              raise ValueError('Unexpected SARIF schema identity')
          Path(sys.argv[1]).write_bytes(raw)
          PY
          SG_EXTERNAL_STANDARDS_TEST=1 SG_SARIF_SCHEMA="$RUNNER_TEMP/sarif-schema.json" "$PY" -m unittest discover -s scripts -p test_standards_batch.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-standards-lock-candidate
          path: ${{ runner.temp }}/sg-standards-lock-candidate/
          if-no-files-found: error
          retention-days: 7
