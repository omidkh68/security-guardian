name: Private preview provenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-preview-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build preview without publishing
        run: |
          set -euo pipefail
          node -e 'if(require("./package.json").private!==true)process.exit(1)'
          dir="$RUNNER_TEMP/sg-provenance"
          mkdir -p "$dir"
          npm pack --ignore-scripts --pack-destination "$dir" --json > "$dir/pack.json"
          file="$(node -p 'require(process.argv[1])[0].filename' "$dir/pack.json")"
          mv "$dir/$file" "$dir/preview.tgz"
          cd "$dir"
          sha256sum preview.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-preview
          path: |
            ${{ runner.temp }}/sg-provenance/preview.tgz
            ${{ runner.temp }}/sg-provenance/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  attest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-preview
          path: preview
      - run: cd preview && sha256sum --check SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: preview/preview.tgz
      - name: Verify signed provenance using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh attestation verify preview/preview.tgz --repo "$REPO" --signer-workflow "$REPO/.github/workflows/private-preview-provenance.yml" --source-digest "$SHA" --source-ref refs/heads/main --format json > verification.json
          python -c 'import json; x=json.load(open("verification.json")); assert isinstance(x,list) and x'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-provenance-verification
          path: verification.json
          if-no-files-found: error
          retention-days: 7
