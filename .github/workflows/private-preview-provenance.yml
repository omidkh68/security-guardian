name: Private preview provenance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build preview without publishing
        run: |
          set -euo pipefail
          node -e 'if(require("./package.json").private!==true)process.exit(1)'
          dir="$RUNNER_TEMP/sg-provenance"
          mkdir -p "$dir"
          npm pack --ignore-scripts --pack-destination "$dir" --json > "$dir/pack.json"
          file="$(node -p 'require(process.argv[1])[0].filename' "$dir/pack.json")"
          mv "$dir/$file" "$dir/preview.tgz"
          cd "$dir"
          sha256sum preview.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: private-preview
          path: |
            ${{ runner.temp }}/sg-provenance/preview.tgz
            ${{ runner.temp }}/sg-provenance/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  attest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: private-preview
          path: preview
      - run: cd preview && sha256sum --check SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: preview/preview.tgz
      - name: Verify signed provenance using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh attestation verify preview/preview.tgz --repo "$REPO" --signer-workflow "$REPO/.github/workflows/private-preview-provenance.yml" --source-digest "$SHA" --format json > verification.json
          test -s verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: preview-provenance-verification
          path: verification.json
          if-no-files-found: error
          retention-days: 7
