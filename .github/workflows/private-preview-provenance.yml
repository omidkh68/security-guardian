name: Private preview provenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-preview-provenance.yml'
      - 'scripts/verify_slsa_sources.py'
      - 'scripts/test_slsa_sources.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate pinned SLSA normative sources
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p test_slsa_sources.py -v
          python scripts/verify_slsa_sources.py | tee "$RUNNER_TEMP/slsa-source-evidence.json"
      - name: Build and smoke-test exact preview without publishing
        run: |
          set -euo pipefail
          node -e 'if(require("./package.json").private!==true)process.exit(1)'
          dir="$RUNNER_TEMP/sg-provenance"
          node --test tests/npm-artifact-evidence.test.mjs
          node scripts/verify-npm-package.mjs --artifact-dir "$dir"
          cd "$dir"
          sha256sum --check SHA256SUMS
          file="$(node -p 'require("./tested-artifact.json").tarball')"
          mv -- "$file" preview.tgz
          sha256sum preview.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-preview
          path: |
            ${{ runner.temp }}/sg-provenance/preview.tgz
            ${{ runner.temp }}/sg-provenance/SHA256SUMS
            ${{ runner.temp }}/sg-provenance/tested-artifact.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slsa-normative-source-evidence
          path: ${{ runner.temp }}/slsa-source-evidence.json
          if-no-files-found: error
          retention-days: 7
  attest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-preview
          path: preview
      - run: cd preview && sha256sum --check SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: preview/preview.tgz
  verify:
    needs: [build, attest]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-preview
          path: preview
      - run: cd preview && sha256sum --check SHA256SUMS
      - name: Verify signed provenance using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh attestation verify preview/preview.tgz --repo "$REPO" --signer-workflow "$REPO/.github/workflows/private-preview-provenance.yml" --source-digest "$SHA" --source-ref refs/heads/main --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners --format json > verification.json
          # Negative controls use actual verification, not a synthetic signature.
          cp preview/preview.tgz "$RUNNER_TEMP/tampered-preview.tgz"
          printf x >> "$RUNNER_TEMP/tampered-preview.tgz"
          if gh attestation verify "$RUNNER_TEMP/tampered-preview.tgz" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/private-preview-provenance.yml" --source-digest "$SHA" --source-ref refs/heads/main --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners > /dev/null 2>&1; then
            echo "ERROR: altered artifact accepted" >&2; exit 1
          fi
          if gh attestation verify preview/preview.tgz --repo "$REPO" --signer-workflow "$REPO/.github/workflows/private-preview-provenance.yml" --source-digest "$SHA" --source-ref refs/heads/slsa-negative-control --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners > /dev/null 2>&1; then
            echo "ERROR: incorrect source ref accepted" >&2; exit 1
          fi
          echo "Tampered artifact and incorrect source ref rejected"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          raw=Path('verification.json').read_bytes()
          result=json.loads(raw)
          if not isinstance(result,list) or not result:
              raise ValueError('Missing successful verification result')
          artifact=Path('preview/preview.tgz')
          digest=hashlib.sha256(artifact.read_bytes()).hexdigest()
          receipt_raw=Path('preview/tested-artifact.json').read_bytes()
          receipt=json.loads(receipt_raw)
          if (receipt.get('kind')!='TESTED_NPM_ARTIFACT' or receipt.get('private') is not True
              or receipt.get('package')!='@omidkh68/security-guardian'
              or receipt.get('source_commit')!=os.environ['SHA']
              or receipt.get('sha256')!=digest or receipt.get('bytes')!=artifact.stat().st_size):
              raise ValueError('Tested artifact receipt does not bind verified preview')
          evidence={'schema_version':1,'kind':'PRIVATE_PREVIEW_PROVENANCE_VERIFICATION',
                    'repository':os.environ['REPO'],'source_commit':os.environ['SHA'],
                    'source_ref':'refs/heads/main','workflow_run_id':os.environ['GITHUB_RUN_ID'],
                    'artifact_sha256':digest,
                    'verification_sha256':hashlib.sha256(raw).hexdigest(),
                    'tested_artifact_receipt_sha256':hashlib.sha256(receipt_raw).hexdigest(),
                    'verification':'GH_ATTESTATION_VERIFY_SUCCEEDED',
                    'negative_controls':{'tampered_artifact':'REJECTED','incorrect_source_ref':'REJECTED'},
                    'slsa_level':'NOT_ASSESSED','publication':'NOT_PERFORMED'}
          Path('verification-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True))
          print(json.dumps(evidence,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-provenance-verification
          path: |
            verification.json
            verification-evidence.json
            preview/tested-artifact.json
          if-no-files-found: error
          retention-days: 7
