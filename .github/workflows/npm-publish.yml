name: npm trusted publish
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Require approved stable tag on main history
        run: |
          node scripts/check-npm-release.mjs
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Enforce maintainer release checklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/omidkh68/security-guardian/issues/105 > "$RUNNER_TEMP/sg-release-gate.json"
          node scripts/check-release-gate.mjs "$RUNNER_TEMP/sg-release-gate.json"
      - name: Validate and test release
        run: |
          python scripts/validate_package.py
          python -m pip install -r requirements-pdf.txt
          python -m unittest discover -s plugins/security-guardian/skills/security-guardian/tests -v
          npm test
          node --test tests/npm-artifact-evidence.test.mjs tests/release-gate.test.mjs tests/registry-artifact.test.mjs
          node scripts/verify-npm-package.mjs --artifact-dir "$RUNNER_TEMP/npm-release"
      - name: Check exact tested release artifact
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npm-release"
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: release-artifact
      - name: Publish verified tarball using OIDC
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum -c SHA256SUMS
          shopt -s nullglob
          packages=(*.tgz)
          test "${#packages[@]}" -eq 1
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            import { createHash } from "node:crypto";
            const r=JSON.parse(fs.readFileSync("tested-artifact.json","utf8"));
            const bytes=fs.readFileSync(process.argv[1]);
            assert.equal(r.kind,"TESTED_NPM_ARTIFACT");
            assert.equal(r.private,false);
            assert.equal(r.package,"@omidkh68/security-guardian");
            assert.equal("v"+r.version,process.env.GITHUB_REF_NAME);
            assert.equal(r.source_commit,process.env.GITHUB_SHA);
            assert.equal(r.tarball,process.argv[1]);
            assert.equal(r.bytes,bytes.length);
            assert.equal(r.sha256,createHash("sha256").update(bytes).digest("hex"));
          ' "${packages[0]}"
          npm publish "./${packages[0]}" --access public --tag latest --ignore-scripts
  registry-smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: release-artifact
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check exact registry version and CLI
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="@omidkh68/security-guardian@$version"
          for attempt in 1 2 3 4 5 6; do
            if test "$(npm view "$package" version --registry https://registry.npmjs.org/)" = "$version"; then
              break
            fi
            test "$attempt" -lt 6
            sleep 10
          done
          npm view "$package" --json --registry https://registry.npmjs.org/ > "$RUNNER_TEMP/registry-metadata.json"
          shopt -s nullglob
          packages=(release-artifact/*.tgz)
          test "${#packages[@]}" -eq 1
          node scripts/verify-registry-artifact.mjs release-artifact/tested-artifact.json "${packages[0]}" "$RUNNER_TEMP/registry-metadata.json" "$version" "$GITHUB_SHA" | tee "$RUNNER_TEMP/registry-integrity.json"
          test "$(npx --yes --ignore-scripts --registry https://registry.npmjs.org/ --package "$package" -- security-guardian --version)" = "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-integrity
          path: ${{ runner.temp }}/registry-integrity.json
          if-no-files-found: error
