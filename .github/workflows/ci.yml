name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate catalog, plugin metadata, scripts, layouts and documentation pairs
        env:
          SG_DOC_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_package.py
      - name: Install optional PDF renderer for reporting tests
        run: python -m pip install -r requirements-pdf.txt
      - name: Run offline tests
        run: python -m unittest discover -s plugins/security-guardian/skills/security-guardian/tests -v
      - name: Verify no tracked secret-like files or generated reports
        run: |
          if git ls-files | grep -E '(^|/)(\.env(\.|$)|\.security-guardian/)|\.(pem|p12|pfx|key)$' ; then
            echo 'Potentially sensitive file tracked; refusing CI pass' >&2
            exit 1
          fi
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test direct installation and upgrade offline
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          export HOME="$ROOT/home"
          mkdir -p "$HOME" "$ROOT/project"
          bash install.sh --user
          test -f "$HOME/.claude/skills/security-guardian/SKILL.md"
          bash install.sh --user --upgrade
          find "$HOME/.claude/skill-backups" -name 'SKILL.md' -print | grep -q SKILL.md
          bash install.sh --project "$ROOT/project"
          test -f "$ROOT/project/.claude/skills/security-guardian/SKILL.md"

  npm-smoke:
    name: npm smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test local CLI safety and upgrades
        run: npm test
      - name: Verify exact tarball manifest and offline npx install-to-report
        run: node scripts/verify-npm-package.mjs
