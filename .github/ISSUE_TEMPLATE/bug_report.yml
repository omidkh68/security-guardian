name: Bug report (non-sensitive)
description: Report a reproducible bug in the skill, scanner, tracker or installer.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do NOT submit exploitable vulnerability details, secrets, or audit findings from private projects here; use SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: Security Guardian version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Skill instructions, Scanner, Tracker, Installer, Marketplace metadata, Documentation]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce with synthetic inputs
      description: Reproduce on a dummy project with no sensitive values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
