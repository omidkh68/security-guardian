name: Feature request
description: Propose a new control, stack rule or improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Real-world motivation
      description: Explain the use case without exposing private project data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and safety considerations
